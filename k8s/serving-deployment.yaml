apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-serving
  namespace: ml-training
  labels:
    project: mlops-pytorch-pipeline
    role: serving
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: model-serving
  template:
    metadata:
      labels:
        app: model-serving
        project: mlops-pytorch-pipeline
        role: serving
    spec:
      containers:
        - name: serving
          image: mlops-serve:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: model-checkpoints
              mountPath: /app/checkpoints
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: model-checkpoints
          persistentVolumeClaim:
            claimName: model-checkpoints-pvc
            readOnly: true
